<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reverb Private Test</title>

    <!-- samakan dengan user yang login -->
    <meta name="user-id" content="1">

    <!-- ambil dari halaman Laravel yang sudah login -->
    <meta name="csrf-token" content="YOUR_CSRF_TOKEN">

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
</head>
<body>

<script>
Pusher.logToConsole = true;

const userId = document.querySelector('meta[name="user-id"]').content;
// const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

const pusher = new Pusher('startok-key', {
    cluster: 'mt1',
    wsHost: 'localhost',
    wsPort: 8080,
    wssPort: 8080,
    forceTLS: false,
    enabledTransports: ['ws'],

    authEndpoint: 'http://localhost:8000/broadcasting/auth',

    auth: {
        headers: {
            Authorization: 'Bearer 8a9224005dcfc51917b323a0d01e5834cef39b3d1df282999cdd926f01174c66'
        }
    }
});

const channel = pusher.subscribe(
    `private-notifications.1`
);

channel.bind('pusher:subscription_succeeded', () => {
    console.log('Authenticated');
});

channel.bind('notification.new', (data) => {
    console.log('Notification:', data);
});

channel.bind_global((event, data) => {
    console.log(event, data);
});
</script>

</body>
</html>
