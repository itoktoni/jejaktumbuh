<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reverb Private Test</title>
    <meta name="user-id" content="1">
    <meta name="csrf-token" content="">
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
</head>
<body>
<h2>Check console (F12) for logs</h2>

<script>
Pusher.logToConsole = true;

const userId = document.querySelector('meta[name="user-id"]').content;

const pusher = new Pusher('startok-key', {
    cluster: 'mt1',
    wsHost: 'localhost',
    wsPort: 8080,
    wssPort: 8080,
    forceTLS: false,
    enabledTransports: ['ws'],
    authEndpoint: 'http://backend.test/broadcasting/auth',
    auth: {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    }
});

const channel = pusher.subscribe(`private-notifications.${userId}`);

channel.bind('pusher:subscription_succeeded', () => {
    console.log('✅ Authenticated & subscribed');
});

channel.bind('notification.new', (data) => {
    console.log('🔔 Notification:', data);
});

channel.bind_global((event, data) => {
    console.log('📡 Event:', event, data);
});

pusher.connection.bind('state_change', (states) => {
    console.log('🔌 State:', states.previous, '->', states.current);
});

pusher.connection.bind('error', (err) => {
    console.log('❌ Error:', err);
});
</script>

</body>
</html>
